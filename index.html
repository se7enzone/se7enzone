<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SE7ENZONE</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome hanya untuk ikon lonceng -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Sticky -->
    <header class="header">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <!-- Ikon Garis Tiga Kustom -->
        <button class="custom-menu-btn" aria-label="Menu">
            <span class="line line-1"></span>
            <span class="line line-2"></span>
            <span class="line line-3"></span>
        </button>
        
        <!-- Judul Logo (opsional jika ingin ditaruh tengah, atau biarkan sesuai kode lama min) -->
            <span style="font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 15px; color: #ffffff; letter-spacing: 1px;">SE7ENZONE</span>
        
        <!-- Ikon Lonceng Notifikasi Kustom -->
            <a href="notifikasi.html" class="nav-icon-btn" aria-label="Notifikasi">
            <i class="fa-solid fa-bell"></i>
            </a>
        </div>

        <!-- Ikon Kolom Search Kustom -->
        <div class="search-container" style="margin-top: 12px; width: 100%; position: relative;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #777777; font-size: 14px;"></i>
            <input type="text" placeholder="Cari game atau produk..." style="width: 100%; background-color: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 10px 14px 10px 40px; color: #ffffff; font-size: 14px; outline: none;">
        </div>
    </header>

        <!-- Bagian Banner Flash Sale Presisi Ala PixelLab -->
        <section class="flash-sale-section">
            <div class="flash-sale-banner">
                <div class="flash-left-content">
                    <div class="flash-sale-group">
                        <!-- Angka 30 Besar di Kiri -->
                        <span class="font-bebas">50</span>
                        <!-- Kolom Kanan untuk % dan OFF yang bertumpuk -->
                        <div class="flash-right-stack">
                            <span class="font-lemonmilk">%</span>
                            <span class="font-poppins-extrabold">OFF</span>
                        </div>
                    </div>
                    <div class="flash-sale-subtitle">special launch day</div>
                    <!-- Tombol Mungil Estetik Tanpa Panah -->
                    <a href="#" class="flash-action-btn">Lihat Produk</a>
                </div>
            </div>
        </section>

    <!-- Kumpulan Tombol Navigasi Kategori (Posisi di Kiri) -->
<div class="store-nav-tabs">
    <button class="nav-tab-btn active" onclick="switchTab(event, 'produk-section')">Pilihan Produk</button>
    <button class="nav-tab-btn" onclick="switchTab(event, 'order-section')">Cara Order</button>
</div>

<!-- Konten Tab Produk -->
<div id="produk-section" class="tab-content active-content">
    
    <!-- CARD PRODUK 1 -->
    <div class="product-single-container">
        <div class="product-card">
            <div class="product-img-wrapper">
                <img src="produk_sbg.jpg" alt="Produk">
            </div>
            <div class="product-info">
                <div class="product-title">Advance Server Level 3</div>
                <div class="product-support-text">Multi-Region</div>
                <div class="product-bottom-row">
                    <div class="product-price-wrapper">
                        <span class="product-price-old">Rp 5.000</span>
                        <span class="product-price-current">Rp 2.500</span>
                    </div>
                    <button class="cart-btn">
                        <svg style="width: 14px; height: 14px; stroke: #ffffff;" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CARD PRODUK 2 -->
    <div class="product-single-container">
        <div class="product-card">
            <div class="product-img-wrapper">
                <img src="produk_sbg.jpg" alt="Produk">
            </div>
            <div class="product-info">
                <div class="product-title">Advance Server Level 3</div>
                <div class="product-support-text">Indonesia Server</div>
                <div class="product-bottom-row">
                    <div class="product-price-wrapper">
                        <span class="product-price-old">Rp 14.000</span>
                        <span class="product-price-current">Rp 7.000</span>
                    </div>
                    <button class="cart-btn">
                        <svg style="width: 14px; height: 14px; stroke: #ffffff;" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="order-section" class="tab-content">
    <!-- Masukkan panduan cara order atau FAQ Moonton di sini -->
    <p style="color: #aaa; font-size: 12px; padding: 10px 0;">Panduan cara order dan login akun game...</p>
</div>
             
                <!-- --- Bottom Sheet (Panel Pilihan Produk & Varian) --- -->
<div class="bottom-sheet-overlay" id="bottomSheet">
    <div class="bottom-sheet-content">
        <!-- Garis kecil indikator tarik di atas modal -->
        <div class="sheet-handle"></div>
        
        <!-- Bagian Preview Produk (Gambar & Detail Utama) -->
        <div class="sheet-product-preview">
            <div class="sheet-img-box">
                <img id="sheetProductImg" src="" alt="Produk">
            </div>
            <div class="sheet-info-box">
                <div class="sheet-title" id="sheetProductTitle">Nama Produk</div>
                <div class="sheet-subtitle" id="sheetProductRegion">Region / Keterangan</div>
                <div class="sheet-price" id="sheetProductPrice">Rp 0</div>
            </div>
        </div>
        
        <!-- Area Tombol Pilihan Varian / Jenis -->
        <div class="variant-section">
            <span class="variant-label">Pilih Varian:</span>
            <div class="variant-options" id="sheetVariantContainer">
                <!-- Tombol varian akan terisi otomatis atau dinamis di sini -->
                <button class="variant-btn active">Varian 1</button>
                <button class="variant-btn">Varian 2</button>
            </div>
        </div>
        
        <!-- Tombol Pesan Sekarang (Menuju Card Form Pembayaran) -->
        <button class="sheet-order-btn" id="sheetOrderBtn">PESAN SEKARANG</button>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
