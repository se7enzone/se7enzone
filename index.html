<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE7ENZONE</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome hanya untuk ikon lonceng -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Sticky dengan Ikon Diperbesar tapi Ketebalan Garis Tetap -->
    <header class="navbar">
        <div class="container nav-container">
            <!-- Ikon Garis Tiga (Ukuran besar, ketebalan garis standar 2.0) -->
            <button class="icon-btn menu-btn" aria-label="Menu" style="margin-left: -4px;">
                <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="13" y2="18"></line>
                </svg>
            </button>

        <button class="nav-icon-btn" aria-label="Notifikasi">
            <i class="fa-solid fa-bell"></i>
        </button>
    </header>

    <script src="script.js"></script>
</body>
</html>
