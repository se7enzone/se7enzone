<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SE7ENZONE</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome hanya untuk ikon lonceng -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Sticky -->
    <header class="header">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <!-- Ikon Garis Tiga Kustom -->
        <button class="custom-menu-btn" aria-label="Menu">
            <span class="line line-1"></span>
            <span class="line line-2"></span>
            <span class="line line-3"></span>
        </button>
        
        <!-- Judul Logo (opsional jika ingin ditaruh tengah, atau biarkan sesuai kode lama min) -->
            <span style="font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 15px; color: #ffffff; letter-spacing: 1px;">SE7ENZONE</span>
        
        <!-- Ikon Lonceng Notifikasi Kustom -->
            <a href="notifikasi.html" class="nav-icon-btn" aria-label="Notifikasi">
            <i class="fa-solid fa-bell"></i>
            </a>
        </div>

        <!-- Ikon Kolom Search Kustom -->
        <div class="search-container" style="margin-top: 12px; width: 100%; position: relative;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #777777; font-size: 14px;"></i>
            <input type="text" placeholder="Cari game atau produk..." style="width: 100%; background-color: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 10px 14px 10px 40px; color: #ffffff; font-size: 14px; outline: none;">
        </div>
    </header>

        <!-- Bagian Banner Flash Sale Presisi Ala PixelLab -->
        <section class="flash-sale-section">
            <div class="flash-sale-banner">
                <div class="flash-left-content">
                    <div class="flash-sale-group">
                        <!-- Angka 30 Besar di Kiri -->
                        <span class="font-bebas">30</span>
                        <!-- Kolom Kanan untuk % dan OFF yang bertumpuk -->
                        <div class="flash-right-stack">
                            <span class="font-lemonmilk">%</span>
                            <span class="font-poppins-extrabold">OFF</span>
                        </div>
                    </div>
                    <div class="flash-sale-subtitle">special launch day</div>
                    <!-- Tombol Mungil Estetik Tanpa Panah -->
                    <a href="#" class="flash-action-btn">Lihat Produk</a>
                </div>
            </div>
        </section>

    <script src="script.js"></script>
</body>
</html>
