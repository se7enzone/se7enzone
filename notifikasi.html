<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifikasi - SE7ENZONE</title>
    <!-- Menghubungkan ke file CSS yang sama -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Orbitron dan FontAwesome untuk ikon -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Khusus Halaman Notifikasi -->
    <header class="header">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            
            <!-- Tombol Kembali (Ikon Panah Kiri) -->
            <a href="index.html" class="nav-back-btn" aria-label="Kembali">
                <i class="fa-solid fa-chevron-left"></i>
            </a>

            <!-- Judul Halaman -->
            <span style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 15px; color: #ffffff; letter-spacing: 1px;">Notifikasi</span>

            <!-- Ikon Lonceng di Kanan -->
            <button class="nav-icon-btn" aria-label="Notifikasi">
                <i class="fa-solid fa-bell"></i>
            </button>
            
        </div>
    </header>

    <!-- Konten Sementara untuk Halaman Notifikasi -->
    <main style="padding: 20px; color: #ffffff; font-family: sans-serif;">
        <p style="text-align: center; color: #888888; font-size: 14px; margin-top: 40px;">Belum ada riwayat transaksi atau notifikasi baru.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
